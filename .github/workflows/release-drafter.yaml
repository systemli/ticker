name: Release Drafter

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    name: Update Release
    runs-on: ubuntu-24.04
    steps:
      - name: Publish Release
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
